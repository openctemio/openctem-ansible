---
- name: Tools (Debian)
  ansible.builtin.apt:
    name: [curl, openssl]
    state: present
  when: ansible_os_family == 'Debian'

- name: Tools (RedHat)
  ansible.builtin.dnf:
    name: [curl, openssl]
    state: present
  when: ansible_os_family == 'RedHat'

- name: Config directory
  ansible.builtin.file:
    path: /etc/openctem
    state: directory
    owner: root
    group: root
    mode: '0750'

- name: Monitor script
  ansible.builtin.template:
    src: openctem-monitor.sh.j2
    dest: /usr/local/sbin/openctem-monitor
    owner: root
    group: root
    mode: '0750'

# The webhook URL is a credential: root-only file, never logged.
- name: Webhook settings
  ansible.builtin.copy:
    dest: /etc/openctem/monitor.env
    content: "WEBHOOK_URL={{ monitoring_webhook_url | quote }}\n"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when: monitoring_webhook_url | length > 0

- name: No webhook configured
  ansible.builtin.file:
    path: /etc/openctem/monitor.env
    state: absent
  when: monitoring_webhook_url | length == 0

- name: Dead-man's-switch URL
  ansible.builtin.copy:
    dest: /etc/openctem/monitor-deadman.env
    content: "DEADMAN_URL={{ monitoring_deadman_url | quote }}\n"
    owner: root
    group: root
    mode: '0600'
  no_log: true
  when: monitoring_deadman_url | length > 0

- name: No dead-man's-switch configured
  ansible.builtin.file:
    path: /etc/openctem/monitor-deadman.env
    state: absent
  when: monitoring_deadman_url | length == 0

- name: Email alerting settings
  ansible.builtin.copy:
    dest: /etc/openctem/monitor-email.env
    content: |
      EMAIL_TO={{ monitoring_email_to | quote }}
      EMAIL_FROM={{ monitoring_email_from | quote }}
    owner: root
    group: root
    mode: '0600'
  when: monitoring_email_to | length > 0

- name: No email alerting configured
  ansible.builtin.file:
    path: /etc/openctem/monitor-email.env
    state: absent
  when: monitoring_email_to | length == 0

- name: Systemd service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - name: openctem-monitor.service
      content: |
        # Managed by Ansible (roles/monitoring).
        [Unit]
        Description=OpenCTEM host monitor
        After=docker.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/openctem-monitor
        NoNewPrivileges=true
        PrivateTmp=true
        ProtectHome=true
        TimeoutStartSec=5min
    - name: openctem-monitor.timer
      content: |
        # Managed by Ansible (roles/monitoring).
        [Unit]
        Description=Run the OpenCTEM host monitor

        [Timer]
        OnBootSec=5min
        OnUnitActiveSec={{ monitoring_interval }}

        [Install]
        WantedBy=timers.target
  register: monitoring_units

- name: Enable the timer
  ansible.builtin.systemd_service:
    name: openctem-monitor.timer
    enabled: true
    state: started
    daemon_reload: "{{ monitoring_units.changed }}"
  when: not ansible_check_mode
