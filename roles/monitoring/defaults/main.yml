---
# Paths: roles/openctem_common; backup state as the backup role writes it.
monitoring_backup_state_dir: "{{ backup_state_dir | default('/var/lib/openctem-backup') }}"
monitoring_wal_spool_dir: "{{ openctem_wal_spool_dir | default('/var/lib/openctem-wal-spool') }}"
monitoring_interval: 5min
monitoring_disk_warn_percent: 85
monitoring_backup_max_age_hours: 30
monitoring_cert_warn_days: 14
# External probes through Cloudflare (tunnel path, edge certificate, Access).
monitoring_external_probes: true
monitoring_webhook_url: ''
# Repeat an unchanged alert at most this often (seconds).
monitoring_repeat_seconds: 3600
# Continuous archiving (when the backup role installed it): alert when the oldest
# WAL segment still waiting for upload is older than this, when the spool is
# larger than this, or when the newest base backup is older than this.
monitoring_wal_lag_minutes: 15
monitoring_wal_spool_max_mb: 2048
monitoring_basebackup_max_age_days: 8

# --- Additional monitoring ---
# AIDE file integrity check (runs after the main monitor)
monitoring_aide_check: true
# Second alerting channel (email). Empty = disabled.
monitoring_email_to: ''
monitoring_email_from: "openctem-monitor@{{ inventory_hostname }}"
# Dead-man's-switch: POST to this URL on every SUCCESSFUL run.
# If the URL stops receiving POSTs, the external service alerts.
monitoring_deadman_url: ''
