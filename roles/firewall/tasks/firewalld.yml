---
- name: Admin CIDRs are IPv4 CIDRs
  ansible.builtin.assert:
    that:
      - firewall_admin_cidrs | length > 0
      - firewall_admin_cidrs | reject('match', '^([0-9]{1,3}\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$') | list | length == 0
      - "'0.0.0.0/0' not in firewall_admin_cidrs"
    fail_msg: 'firewall_admin_cidrs must be a non-empty list of IPv4 CIDRs, not 0.0.0.0/0.'

- name: Read this session's SSH_CLIENT (no become)
  ansible.builtin.command: printenv SSH_CLIENT
  become: false
  changed_when: false
  check_mode: false
  failed_when: false
  register: firewall_ssh_client

- name: This controller's address as the host sees it
  ansible.builtin.set_fact:
    firewall_controller_ip: "{{ (firewall_ssh_client.stdout | default('')).split(' ') | first }}"

- name: Check the controller is inside firewall_admin_cidrs
  ansible.builtin.command:
    argv:
      - "{{ ansible_python_interpreter | default('/usr/bin/python3') }}"
      - -c
      - |
        import ipaddress, sys
        ip = ipaddress.ip_address(sys.argv[1])
        sys.exit(0 if any(ip in ipaddress.ip_network(c, strict=False) for c in sys.argv[2].split()) else 1)
      - "{{ firewall_controller_ip }}"
      - "{{ firewall_admin_cidrs | join(' ') }}"
  changed_when: false
  check_mode: false
  register: firewall_inside
  failed_when: false

- name: Refuse to lock this session out
  ansible.builtin.assert:
    that: firewall_inside.rc == 0
    fail_msg: 'Controller address {{ firewall_controller_ip }} is not inside firewall_admin_cidrs {{ firewall_admin_cidrs }}: not enforcing.'

- name: Install firewalld
  ansible.builtin.dnf:
    name: [firewalld]
    state: present

- name: Enable firewalld
  ansible.builtin.systemd_service:
    name: firewalld
    enabled: true
    state: started

- name: Set drop as default zone
  ansible.builtin.command: firewall-cmd --set-default-zone=drop
  register: firewall_default_zone
  changed_when: "'success' in firewall_default_zone.stdout"
  failed_when: firewall_default_zone.rc != 0

- name: Allow SSH from each admin CIDR
  ansible.posix.firewalld:
    rich_rule: 'rule family="ipv4" source address="{{ item }}" port protocol="tcp" port="{{ firewall_ssh_port }}" accept'
    permanent: true
    immediate: true
    state: enabled
  loop: "{{ firewall_admin_cidrs }}"

- name: Reload firewalld
  ansible.builtin.command: firewall-cmd --reload
  changed_when: true

- name: Resulting rules
  ansible.builtin.command: firewall-cmd --list-all
  changed_when: false
  check_mode: false
  register: firewall_status

- name: Show rules
  ansible.builtin.debug:
    var: firewall_status.stdout_lines

- name: Docker publishes no port (firewalld does not filter published ports)
  ansible.builtin.command: docker ps --format '{{ "{{.Names}} {{.Ports}}" }}'
  changed_when: false
  check_mode: false
  failed_when: false
  register: firewall_docker_ports

- name: Ports published beyond loopback
  ansible.builtin.set_fact:
    firewall_published: >-
      {{ firewall_docker_ports.stdout_lines | map('regex_replace', '^\S+ ?', '') | join(', ') | split(', ')
         | select('search', '->') | reject('match', '127\.0\.0\.1:') | list }}
  when: firewall_docker_ports.rc == 0

- name: Assert no container publishes a host port
  ansible.builtin.assert:
    that: firewall_published | length == 0
    fail_msg: "Published ports bypass firewalld: {{ firewall_published }}"
  when: firewall_docker_ports.rc == 0
