---
# Deployment paths (openctem_root, ...): roles/openctem_common.
backup_dir: /var/backups/openctem
backup_state_dir: /var/lib/openctem-backup
# 03:15 UTC daily, up to 15 min random delay; a missed run starts at boot.
backup_on_calendar: '*-*-* 03:15:00'
# Empty: local mode (plaintext, root-only, this host only; off-host copy refused).
# age1...: every file encrypted to this PUBLIC key on the host; off-host allowed.
backup_age_recipient: ''
# Off-host copy, run after each encrypted backup with the new directory as $1.
backup_offsite_command: ''
backup_keep_days: 14
# Signing (every backup manifest, WAL segment and base-backup meta.json is signed
# on the host with an ed25519 key the role generates once; docs/BACKUP-PITR.md).
# The operator keeps the PUBLIC key OFF the host as an allowed_signers file and
# passes it to restores; this variable (optional) also puts a copy on the host
# so the drill can verify there. A host that can be rooted must not be the only
# place that decides what is trusted.
backup_signing_dir: /etc/openctem/backup-signing
backup_signing_allowed_signers: ''
# Pruning from the host. Default off: the bucket credential on the host is
# write-only and the bucket's lifecycle rule prunes. 'true' makes the weekly base
# backup delete (rclone purge/delete) base backups and WAL past the retention
# window, which needs a credential that can delete: then root on the host can
# also wipe every off-host copy (docs/BACKUP-PITR.md).
backup_wal_prune: false

# --- Continuous archiving (openctem_wal_archive: true, roles/openctem_common) ----------
# rclone remote definition ([openctem-backup], type s3) with the access token:
# YOU place it on the server, root:root mode 0400/0600. Never in the inventory.
backup_wal_remote_conf: "{{ openctem_secrets_dir }}/backup_remote.conf"
# Where the archive goes: s3 (any S3-compatible service: AWS S3, Cloudflare R2, MinIO, ...)
# or sftp (another host). The remote definition in backup_wal_remote_conf must be of the same type.
backup_wal_target: s3
# Bucket (s3) or the directory on the SFTP host (sftp, relative to the login directory),
# and the path inside it (several stacks may share one bucket).
backup_wal_bucket: ''
# sftp only: YOU place both on the server, root:root mode 0400/0600, and the remote definition
# names them as known_hosts_file = /config/known_hosts and key_file = /config/sftp_key. The host
# key is pinned in the first file: the archive is never sent to an unverified host.
backup_wal_sftp_known_hosts: "{{ openctem_secrets_dir }}/backup_known_hosts"
backup_wal_sftp_key: "{{ openctem_secrets_dir }}/backup_sftp_key"
# true: the play writes a probe object with the host's credential and then tries to delete
# it, and stops when the delete works (the credential must not be able to delete: docs/BACKUP-PITR.md).
# Also runnable any time: openctem-backup-probe. Default off: not every service can be restricted that way.
backup_wal_require_append_only: false
backup_wal_prefix: "{{ openctem_project }}"
# Point-in-time recovery window: base backups and WAL older than this (and
# older than the newest base backup before the window) are deleted from the bucket.
backup_wal_retention_days: 14
backup_basebackup_on_calendar: 'Sun *-*-* 02:30:00'
backup_wal_ship_interval: 1min
# openctem-restore --pitr downloads WAL uploaded up to this long after the
# target time (upload lag, then a margin).
backup_pitr_fetch_slack_hours: 6
