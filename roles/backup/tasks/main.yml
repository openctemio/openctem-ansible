---
- name: Backup mode
  ansible.builtin.set_fact:
    backup_mode: "{{ 'age' if (backup_age_recipient | default('') | length > 0) else 'local' }}"

# Public key only. A private key (AGE-SECRET-KEY-...) never goes on this host.
- name: The recipient is an age public key
  ansible.builtin.assert:
    that:
      - backup_age_recipient is match('^age1[02-9ac-hj-np-z]{58}$')
      - "'AGE-SECRET-KEY' not in backup_age_recipient | upper"
    fail_msg: 'backup_age_recipient must be an age PUBLIC key (age1...), never an identity.'
  when: backup_mode == 'age'

- name: Off-host copy needs encryption
  ansible.builtin.assert:
    that: backup_mode == 'age'
    fail_msg: >-
      backup_offsite_command is set but backups are not encrypted: set backup_age_recipient first
      (dumps and the secrets archive never leave the host in plaintext).
  when: backup_offsite_command | length > 0

- name: Signing tool
  ansible.builtin.apt:
    name: [openssh-client]
    state: present

- name: Install age
  ansible.builtin.apt:
    name: [age]
    state: present
    update_cache: true
    cache_valid_time: 3600
  when: backup_mode == 'age'

- name: Directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: /etc/openctem, mode: '0750' }
    - { path: /usr/local/lib/openctem, mode: '0755' }
    - { path: "{{ backup_dir }}", mode: '0700' }
    - { path: "{{ backup_state_dir }}", mode: '0700' }

- name: Recipient (public key)
  ansible.builtin.copy:
    dest: /etc/openctem/backup-recipients.txt
    content: "{{ backup_age_recipient }}\n"
    owner: root
    group: root
    mode: '0644'
  when: backup_mode == 'age'

- name: No recipient in local mode
  ansible.builtin.file:
    path: /etc/openctem/backup-recipients.txt
    state: absent
  when: backup_mode == 'local'

# Backups are signed so that a bucket writer cannot plant a dump (age alone
# proves nothing about the author: the recipient key is public).
- name: Signing key directory
  ansible.builtin.file:
    path: "{{ backup_signing_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Signing key (generated once, on this host)
  ansible.builtin.command:
    argv: [ssh-keygen, -q, -t, ed25519, -N, '', -C, openctem-backup, -f, "{{ backup_signing_dir }}/id_ed25519"]
    creates: "{{ backup_signing_dir }}/id_ed25519"
  register: backup_signing_key
  when: not ansible_check_mode

- name: Signing key permissions
  ansible.builtin.file:
    path: "{{ backup_signing_dir }}/{{ item.name }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { name: id_ed25519, mode: '0400' }
    - { name: id_ed25519.pub, mode: '0644' }
  when: not ansible_check_mode

- name: Read the signing public key
  ansible.builtin.slurp:
    src: "{{ backup_signing_dir }}/id_ed25519.pub"
  register: backup_signing_pub
  when: not ansible_check_mode

- name: Allowed signers are in the allowed_signers format
  ansible.builtin.assert:
    that:
      - >-
        backup_signing_allowed_signers.splitlines()
        | select('match', '^\s*[^#\s]')
        | reject('match', '^openctem-backup( namespaces="[^"]*")? ssh-ed25519 [A-Za-z0-9+/=]+( .*)?$')
        | list | length == 0
    fail_msg: >-
      backup_signing_allowed_signers lines must read: openctem-backup ssh-ed25519 <public key>
      (the line the backup play prints, or `ssh-keygen -y` of the signing key).
  when: backup_signing_allowed_signers | length > 0

- name: Allowed signers copy (optional, for the drill on this host)
  ansible.builtin.copy:
    dest: /etc/openctem/backup-allowed-signers
    content: "{{ backup_signing_allowed_signers | trim }}\n"
    owner: root
    group: root
    mode: '0644'
  when: backup_signing_allowed_signers | length > 0

- name: No allowed signers copy when none is configured
  ansible.builtin.file:
    path: /etc/openctem/backup-allowed-signers
    state: absent
  when: backup_signing_allowed_signers | length == 0

- name: Off-host copy hook
  ansible.builtin.copy:
    dest: /etc/openctem/backup-offsite.sh
    content: |
      #!/bin/sh
      # Managed by Ansible (roles/backup).
      # $1 = the new encrypted backup directory.
      set -eu
      {{ backup_offsite_command }} "$1"
    owner: root
    group: root
    mode: '0700'
  when: backup_offsite_command | length > 0

- name: No off-host hook when none is configured
  ansible.builtin.file:
    path: /etc/openctem/backup-offsite.sh
    state: absent
  when: backup_offsite_command | length == 0

- name: Scripts
  ansible.builtin.template:
    src: "{{ item.src }}"
    dest: "{{ item.dest }}"
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { src: openctem-backup.sh.j2, dest: /usr/local/sbin/openctem-backup, mode: '0750' }
    - { src: openctem-restore-drill.sh.j2, dest: /usr/local/sbin/openctem-restore-drill, mode: '0750' }
    - { src: openctem-restore.sh.j2, dest: /usr/local/sbin/openctem-restore, mode: '0750' }
    - { src: openctem-restore-common.sh.j2, dest: /usr/local/lib/openctem/restore-common.sh, mode: '0644' }

- name: Systemd service and timer
  ansible.builtin.copy:
    dest: "/etc/systemd/system/{{ item.name }}"
    content: "{{ item.content }}"
    owner: root
    group: root
    mode: '0644'
  loop:
    - name: openctem-backup.service
      content: |
        # Managed by Ansible (roles/backup).
        [Unit]
        Description=OpenCTEM backup (database, uploaded files, secrets)
        Requires=docker.service
        After=docker.service

        [Service]
        Type=oneshot
        ExecStart=/usr/local/sbin/openctem-backup
        Nice=10
        IOSchedulingClass=best-effort
        IOSchedulingPriority=7
        PrivateTmp=true
        NoNewPrivileges=true
        ProtectHome=true
        TimeoutStartSec=2h
    - name: openctem-backup.timer
      content: |
        # Managed by Ansible (roles/backup).
        [Unit]
        Description=Daily OpenCTEM backup

        [Timer]
        OnCalendar={{ backup_on_calendar }}
        RandomizedDelaySec=15min
        Persistent=true

        [Install]
        WantedBy=timers.target
  register: backup_units

- name: Enable the timer
  ansible.builtin.systemd_service:
    name: openctem-backup.timer
    enabled: true
    state: started
    daemon_reload: "{{ backup_units.changed }}"
  when: not ansible_check_mode

- name: Continuous archiving (point-in-time recovery)
  ansible.builtin.include_tasks: "{{ 'wal.yml' if openctem_wal_archive | bool else 'wal_off.yml' }}"

- name: Signing public key (keep it OFF this host)
  ansible.builtin.debug:
    msg: >-
      Backups are signed. Store this line OFF this host (your password manager, the repository of your
      inventory) as the allowed_signers file, and pass it to restores (--allowed-signers=FILE) or set
      backup_signing_allowed_signers: openctem-backup {{ (backup_signing_pub.content | b64decode).split()[:2] | join(' ') }}
  when: not ansible_check_mode

- name: Run a backup now (-e backup_run_now=true)
  ansible.builtin.systemd_service:
    name: openctem-backup.service
    state: started
  when: backup_run_now | default(false) | bool and not ansible_check_mode

- name: Summary
  ansible.builtin.debug:
    msg: >-
      {{ ('Continuous archiving ON to bucket ' ~ backup_wal_bucket ~ '. ' if openctem_wal_archive | bool else '') }}
      {{ 'Backups: ENCRYPTED to ' ~ backup_age_recipient[:12] ~ '... in ' ~ backup_dir
         ~ ('; off-host copy ON' if backup_offsite_command | length > 0 else '; WARNING: NOT off-host (backup_offsite_command empty)')
         if backup_mode == 'age' else
         'WARNING: backups are LOCAL ONLY and NOT encrypted (' ~ backup_dir ~ ', root 0700): losing this host loses them. Set backup_age_recipient.' }}
