---
# The signer's key lives only in its own volume (never mounted into the API).
- name: Create the signer's volumes through compose (labels kept)
  ansible.builtin.command:
    cmd: "{{ openctem_compose }} create --no-recreate signer"
    chdir: "{{ openctem_root }}"
  changed_when: false
  when: not ansible_check_mode

- name: Key file present in the volume
  ansible.builtin.command: >-
    docker run --rm --network none -v {{ openctem_project }}_signer-keys:/k:ro
    {{ openctem_postgres_ref }} test -s /k/signer.pem
  register: openctem_signer_key
  changed_when: false
  failed_when: false
  when: not ansible_check_mode

- name: Create the signer key (prints its id and PUBLIC key; record them)
  ansible.builtin.command: >-
    {{ openctem_compose }} run --rm --no-deps -T
    signer keygen -out /var/lib/openctem-signer/keys/signer.pem
  args:
    chdir: "{{ openctem_root }}"
  register: openctem_signer_keygen
  changed_when: true
  when: not ansible_check_mode and openctem_signer_key.rc != 0

- name: Signer public key
  ansible.builtin.debug:
    var: openctem_signer_keygen.stdout_lines
  when: openctem_signer_keygen is not skipped and openctem_signer_keygen.stdout_lines is defined

# The key never leaves this host unencrypted: openctem-backup copies the
# signer-keys volume only into a backup that is age-encrypted when
# backup_age_recipient is set (README, "Job signer key").
- name: The signer key is backed up encrypted
  ansible.builtin.debug:
    msg: >-
      backup_age_recipient is empty: the signer key is only in the plain local backups of this host. Set it to
      your offline age public key (README, "Job signer key") and keep the age identity off this host.
  when: backup_age_recipient | default('') | length == 0
