---
- name: The requested release is pinned in this kit
  ansible.builtin.assert:
    that:
      - openctem_version in openctem_releases
      - openctem_releases[openctem_version].api is search('@sha256:[0-9a-f]{64}$')
      - openctem_releases[openctem_version].web is search('@sha256:[0-9a-f]{64}$')
      - openctem_releases[openctem_version].gateway is search('@sha256:[0-9a-f]{64}$')
      - openctem_releases[openctem_version].migrations is search('@sha256:[0-9a-f]{64}$')
      - openctem_postgres_image is search('@sha256:[0-9a-f]{64}$')
      - openctem_redis_image is search('@sha256:[0-9a-f]{64}$')
      - cloudflared_image is search('@sha256:[0-9a-f]{64}$')
    fail_msg: '{{ openctem_version }} is not in openctem_releases, or an image is not pinned by digest (scripts/vendor-release.sh).'

- name: Extra API settings are plain names and not owned by this role
  ansible.builtin.assert:
    that:
      - openctem_api_env is mapping
      - openctem_api_env.keys() | reject('match', '^[A-Z][A-Z0-9_]*$') | list | length == 0
      - openctem_api_env.keys() | select('search', 'PASSWORD|SECRET|KEY$|TOKEN') | list | length == 0
      - openctem_api_env.keys() | intersect(openctem_api_env_reserved) | list | length == 0
    fail_msg: >-
      openctem_api_env takes non-secret UPPER_CASE settings only, none of {{ openctem_api_env_reserved }};
      secrets are generated on the host.

- name: The platform console settings are valid
  ansible.builtin.assert:
    that:
      - openctem_admin_host is string
      - openctem_admin_host == '' or openctem_admin_host is match('^[A-Za-z0-9]([A-Za-z0-9.-]*[A-Za-z0-9])?$')
      - openctem_admin_host != openctem_app_host
      - openctem_admin_allowed_cidrs | length > 0
      - openctem_admin_allowed_cidrs | reject('match', '^[0-9a-fA-F:.]+(/[0-9]{1,3})?$') | list | length == 0
    fail_msg: >-
      openctem_admin_host must be empty or a host name other than openctem_app_host, and
      openctem_admin_allowed_cidrs a non-empty list of IP addresses or CIDRs.

- name: The release has the console plane when its own host name is asked for
  ansible.builtin.assert:
    that: openctem_releases[openctem_version].admin_plane | default(false) | bool
    fail_msg: >-
      openctem_admin_host needs a release with the console plane (versions.yml: admin_plane: true);
      {{ openctem_version }} serves the console on {{ openctem_app_host }}. Unset openctem_admin_host or upgrade.
  when: openctem_admin_host | length > 0

- name: The sign-up ceiling is valid
  ansible.builtin.assert:
    that:
      - openctem_tenant_creation_mode is not defined
      - openctem_signup_mode in ['disabled', 'domain', 'open']
    fail_msg: >-
      openctem_signup_mode must be disabled, domain or open. openctem_tenant_creation_mode is removed:
      admin_only is openctem_signup_mode disabled (the default), self_service is open.

- name: Docker and the compose plugin are installed
  ansible.builtin.command: docker compose version --short
  changed_when: false
  check_mode: false
  register: openctem_compose_version

- name: Ingress connector rendered first (roles/cloudflared)
  ansible.builtin.stat:
    path: "{{ openctem_root }}/compose.cloudflared.yml"
  register: openctem_cf_fragment
  when: openctem_ingress == 'cloudflared'

- name: The cloudflared role ran before this one
  ansible.builtin.assert:
    that: openctem_cf_fragment.stat.exists
    fail_msg: 'openctem_ingress=cloudflared: run the cloudflared role first (playbooks/50-openctem.yml does).'
  when: openctem_ingress == 'cloudflared' and not ansible_check_mode
