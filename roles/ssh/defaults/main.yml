---
# Stage 1: DevSec SSH hardening with password login still allowed.
# Stage 2: keys only, after a key-only login from the controller is proven.
ssh_stage: 1
ssh_fail2ban: true
ssh_fail2ban_ignore_cidrs: "{{ admin_cidrs | default([]) }}"
# DevSec ssh_hardening settings shared by both stages.
ssh_devsec_vars:
  ssh_permit_root_login: 'no'
  ssh_allow_tcp_forwarding: 'no'
  ssh_x11_forwarding: false
  ssh_max_auth_retries: 3
  ssh_client_alive_interval: 300
  ssh_client_alive_count_max: 3
  # Legal warning banner (CIS 5.2.16). devsec puts the directive in
  # sshd_config; this role writes the file it points at.
  ssh_banner: true
  ssh_banner_path: /etc/issue.net
# --- Additional hardening (CIS) ---
# Restrict SSH to these users/groups. Empty list = no restriction.
ssh_allow_users: []
ssh_allow_groups: []
# The banner lives in ssh_devsec_vars: ssh_banner and ssh_banner_path are
# devsec ssh_hardening's own names, and defining them here too would shadow
# that role's values and make passing them to it a self-referencing loop.
# fail2ban tuning
ssh_fail2ban_maxretry: 3
ssh_fail2ban_bantime: '1h'
ssh_fail2ban_findtime: '10m'
