---
# Each component can be turned off on its own.
os_baseline_unattended_upgrades: true
# Security updates only; a reboot is never automatic unless the owner sets this.
os_baseline_unattended_reboot: false
os_baseline_unattended_reboot_time: '03:30'
os_baseline_chrony: true
os_baseline_auditd: true
os_baseline_journald: true
os_baseline_journald_system_max_use: 1G
os_baseline_journald_max_retention: 1month
# DevSec OS hardening (devsec.hardening.os_hardening) with the settings a
# Docker host needs. Turn off to keep only the components above.
os_baseline_devsec_os: true
os_baseline_devsec_vars:
  os_pam_enabled: false
  os_user_pw_ageing: false
  os_chmod_home_folders: false
  os_filesystem_whitelist: ['overlay', 'squashfs']
  # Docker bridge NAT needs forwarding; the role would turn it off.
  sysctl_overwrite:
    net.ipv4.ip_forward: 1
# Time sync. chrony's stock `makestep 1 3` steps the clock only during the
# first 3 updates after boot, so a later large drift is slewed for hours. The
# drop-in steps whenever the offset exceeds the threshold (limit -1 = always).
os_baseline_chrony_makestep_threshold: 1
os_baseline_chrony_makestep_limit: -1
# The clock check (preflight and end of this role) fails above this many seconds.
os_baseline_clock_max_offset: 5
os_baseline_clock_retries: 12
os_baseline_clock_delay: 5
