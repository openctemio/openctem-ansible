---
- name: Restart chrony
  ansible.builtin.systemd_service:
    name: chrony
    state: restarted

# Runs after the restart above (handlers run in file order).
- name: Step the clock now
  ansible.builtin.command: chronyc makestep
  changed_when: true
  failed_when: false

- name: Restart journald
  ansible.builtin.systemd_service:
    name: systemd-journald
    state: restarted

# auditd refuses systemctl restart (RefuseManualStop); augenrules loads rules.
- name: Load audit rules
  ansible.builtin.command: augenrules --load
  changed_when: true

- name: Restart rsyslog
  ansible.builtin.systemd_service:
    name: rsyslog
    state: restarted
