---
- name: Pinned versions and digests
  ansible.builtin.include_vars:
    file: "{{ role_path }}/../../versions.yml"
  tags: [always]

- name: Settings
  ansible.builtin.import_tasks: checks.yml

- name: Secrets directory (the OpenCTEM stage uses the same one)
  ansible.builtin.file:
    path: "{{ openctem_secrets_dir }}"
    state: directory
    owner: root
    group: root
    mode: '0700'

- name: Smarthost login file (metadata only)
  ansible.builtin.stat:
    path: "{{ mail_relay_smarthost_env_file }}"
    get_checksum: false
    get_mime: false
    get_attributes: false
  register: mail_relay_login_file
  when: mail_relay_smarthost_login | bool
  no_log: true

- name: The login file is in place, root's, 0400
  ansible.builtin.assert:
    that:
      - mail_relay_login_file.stat.exists
      - mail_relay_login_file.stat.uid == 0
      - mail_relay_login_file.stat.mode == '0400'
    fail_msg: >-
      mail_relay_smarthost_login is true but {{ mail_relay_smarthost_env_file }} is missing or not root 0400.
      Create it on the server with the RELAYHOST_USERNAME and RELAYHOST_PASSWORD variables, one per line.
    quiet: true
  when: mail_relay_smarthost_login | bool and not ansible_check_mode

- name: Directories
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ mail_relay_root }}", mode: '0755' }
    - { path: "{{ mail_relay_root }}/tls", mode: '0700' }
    - { path: "{{ openctem_secrets_dir }}/mail_relay_ca", mode: '0700' }
    - { path: "{{ openctem_secrets_dir }}/mail_relay_dkim", mode: '0700' }
  loop_control:
    label: "{{ item.path }}"

- name: Certificate authority and submission certificate
  ansible.builtin.import_tasks: pki.yml

- name: DKIM keys
  ansible.builtin.import_tasks: dkim.yml
  when: mail_relay_dkim | bool

- name: Compose file
  ansible.builtin.template:
    src: compose.mail-relay.yml.j2
    dest: "{{ mail_relay_root }}/compose.yml"
    owner: root
    group: root
    mode: '0644'
  register: mail_relay_compose

- name: Start the relay (its own project; the platform's project is never touched)
  ansible.builtin.command:
    cmd: >-
      docker compose -p {{ openctem_mail_relay_project }} --project-directory {{ mail_relay_root }}
      -f {{ mail_relay_root }}/compose.yml up -d --wait --wait-timeout 120
    chdir: "{{ mail_relay_root }}"
  register: mail_relay_up
  changed_when: mail_relay_compose.changed or mail_relay_pki_changed | default(false) | bool or mail_relay_dkim_changed | default(false) | bool
  when: not ansible_check_mode

- name: Restart the relay after a certificate or key change
  ansible.builtin.command:
    cmd: >-
      docker compose -p {{ openctem_mail_relay_project }} --project-directory {{ mail_relay_root }}
      -f {{ mail_relay_root }}/compose.yml restart mail-relay
    chdir: "{{ mail_relay_root }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - not mail_relay_compose.changed
    - (mail_relay_pki_changed | default(false) | bool) or (mail_relay_dkim_changed | default(false) | bool)

- name: DNS records to publish
  ansible.builtin.import_tasks: dns.yml
