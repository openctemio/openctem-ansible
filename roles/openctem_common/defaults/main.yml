---
# Shared by the openctem, cloudflared, backup and monitoring roles.
# Site values (openctem_app_host, openctem_version) come from your inventory.
openctem_root: /opt/openctem  # noqa: var-naming[no-role-prefix]
openctem_project: openctem  # noqa: var-naming[no-role-prefix]
openctem_secrets_dir: "{{ openctem_root }}/secrets"  # noqa: var-naming[no-role-prefix]
openctem_state_dir: "{{ openctem_root }}/state"  # noqa: var-naming[no-role-prefix]
# How traffic reaches the gateway:
#   cloudflared  Cloudflare Tunnel (roles/cloudflared), no host port at all
#   loopback     the gateway publishes 127.0.0.1:openctem_loopback_port for a
#                TLS reverse proxy you run on this host (optional alternative)
openctem_ingress: cloudflared  # noqa: var-naming[no-role-prefix]
openctem_loopback_port: 8080  # noqa: var-naming[no-role-prefix]
# Fixed internal network for the ingress hop (cloudflared .10, gateway .11).
openctem_net_tunnel: 172.30.81  # noqa: var-naming[no-role-prefix]
# Compose project names this kit refuses to touch (other stacks that may
# share a Docker host). Every compose call names its project and files
# explicitly; none relies on the working directory.
openctem_protected_projects: [openctemio, openctem-sensor, openctemio-obs]  # noqa: var-naming[no-role-prefix]
openctem_compose: >-  # noqa: var-naming[no-role-prefix]
  docker compose -p {{ openctem_project }} --project-directory {{ openctem_root }}
  -f {{ openctem_root }}/compose.yml{{ (' -f ' ~ openctem_root ~ '/compose.cloudflared.yml') if openctem_ingress == 'cloudflared' else '' }}

# Continuous archiving of the database (point-in-time recovery, README §5).
# Off by default: it needs an S3-compatible bucket and an access token that
# only the owner can provide, and the backup role's age recipient. When true:
#   roles/openctem  Postgres archives each finished WAL segment into a spool
#                   directory (archive_mode=on: a one-time Postgres restart)
#   roles/backup    openctem-wal-ship encrypts and uploads the spool every
#                   minute, openctem-base-backup takes a weekly base backup
#                   and prunes the bucket, openctem-restore --pitr recovers.
# A segment is also closed every openctem_wal_archive_timeout seconds while
# the database is busy, which bounds the data loss (RPO) together with the
# upload interval.
openctem_wal_archive: false  # noqa: var-naming[no-role-prefix]
openctem_wal_spool_dir: /var/lib/openctem-wal-spool  # noqa: var-naming[no-role-prefix]
openctem_wal_archive_timeout: 300  # noqa: var-naming[no-role-prefix]

# Outbound-only networks (the only stack networks with a route to the
# internet): the API's and the tunnel connector's. The firewall role's egress
# policy is keyed on these subnets.
openctem_net_egress_api: 172.30.84  # noqa: var-naming[no-role-prefix]
cloudflared_net_egress: 172.30.83  # noqa: var-naming[no-role-prefix]

# Outbound policy of the stack's containers (roles/firewall, docs/FIREWALL.md):
#   open        no restriction beyond the networks (the API can reach any address)
#   restricted  containers on the outbound networks cannot reach private,
#               shared (CGNAT), link-local/metadata, loopback or host-local
#               addresses; the internet and the stack itself stay reachable.
# Default: restricted for a hosted service (openctem_signup_mode: open, where
# tenants are strangers), open otherwise. Applied by the firewall play.
openctem_egress_policy: "{{ 'restricted' if (openctem_signup_mode | default('disabled')) == 'open' else 'open' }}"  # noqa: var-naming[no-role-prefix]
# Operator-approved internal destinations (an internal SMTP relay, an
# on-premises ticketing or identity server). Each item: cidr (IPv4, /24 or
# narrower, not link-local), optional port, optional proto (default tcp).
#   - { cidr: 192.0.2.25/32, port: 587 }
openctem_egress_allow: []  # noqa: var-naming[no-role-prefix]
# The host's own DNS resolvers (read when the rules are applied) stay
# reachable on port 53: Docker's embedded resolver forwards to them.
openctem_egress_allow_host_dns: true  # noqa: var-naming[no-role-prefix]
