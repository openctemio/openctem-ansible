---
# Docker CE installation for Rocky Linux / RHEL 9.
- name: Remove conflicting packages (RedHat)
  ansible.builtin.dnf:
    name:
      - docker
      - docker-client
      - docker-client-latest
      - docker-common
      - docker-latest
      - docker-latest-logrotate
      - docker-logrotate
      - docker-engine
      - podman
      - buildah
    state: absent

- name: Install prerequisites
  ansible.builtin.dnf:
    name: [dnf-plugins-core, device-mapper-persistent-data, lvm2]
    state: present

- name: Add Docker CE repository
  ansible.builtin.yum_repository:
    name: docker-ce-stable
    description: Docker CE Stable
    baseurl: "{{ docker_yum_url }}/$releasever/$basearch/stable"
    gpgcheck: true
    gpgkey: "{{ docker_yum_key_url }}"
    enabled: true

- name: Install Docker CE packages
  ansible.builtin.dnf:
    name:
      - "docker-ce{{ '-' ~ docker_rpm_ce_version if docker_rpm_ce_version | default('') | length > 0 else '' }}"
      - "docker-ce-cli{{ '-' ~ docker_rpm_ce_version if docker_rpm_ce_version | default('') | length > 0 else '' }}"
      - "containerd.io{{ '-' ~ docker_rpm_containerd_version if docker_rpm_containerd_version | default('') | length > 0 else '' }}"
      - "docker-compose-plugin{{ '-' ~ docker_rpm_compose_plugin_version if docker_rpm_compose_plugin_version | default('') | length > 0 else '' }}"
    state: present

- name: Install versionlock plugin
  ansible.builtin.dnf:
    name: [python3-dnf-plugin-versionlock]
    state: present
  when: docker_hold_packages | bool

- name: Lock Docker package versions
  ansible.builtin.command:
    cmd: dnf versionlock add docker-ce docker-ce-cli containerd.io docker-compose-plugin
  register: docker_versionlock
  changed_when: "'Adding versionlock' in docker_versionlock.stdout"
  failed_when: false
  when: docker_hold_packages | bool

- name: Docker enabled and running
  ansible.builtin.systemd_service:
    name: docker
    enabled: true
    state: started
  when: not ansible_check_mode

- name: Members of the docker group
  ansible.builtin.getent:
    database: group
    key: docker
  failed_when: false
  when: not ansible_check_mode

- name: Assert the docker group is empty
  ansible.builtin.assert:
    that: (ansible_facts.getent_group.docker | default(['', '', '', '']))[2] | default('') == ''
    fail_msg: 'Users are in the docker group (root-equivalent): remove them; use sudo.'
  when: not ansible_check_mode

- name: Versions
  ansible.builtin.command: docker version --format '{{ "{{.Server.Version}}" }}'
  changed_when: false
  register: docker_versions
  when: not ansible_check_mode

- name: Compose plugin version
  ansible.builtin.command: docker compose version --short
  changed_when: false
  register: docker_compose_versions
  when: not ansible_check_mode

- name: Show versions
  ansible.builtin.debug:
    msg: "engine {{ docker_versions.stdout | default('?') }}, compose {{ docker_compose_versions.stdout | default('?') }}"
  when: not ansible_check_mode
