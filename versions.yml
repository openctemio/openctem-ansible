    gateway: ghcr.io/openctemio/openctem-gateway@sha256:e448f6ce632814e1cf3ee2635cbab6c4cda27fae9274a3e78336543f8b412e0e
    migrations: ghcr.io/openctemio/migrations@sha256:3ae87e2a9341be1633b90096bb52a0eae9cef129559efad283e76b474b775f63
