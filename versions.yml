---
# Every pinned version and image digest the roles use. One file, bumped per
# OpenCTEM release (scripts/vendor-release.sh prints the new entry) and per
# dependency update. Roles load it with include_vars; override a value with
# -e only for a test.

# --- OpenCTEM releases: images by digest -----------------------------------------
# Every digest is checked against the release workflow's keyless cosign
# signature (identity: docker-publish.yml at that tag) before it is pulled.
# Keep the previous release here: rollback deploys it. The job signer runs
# from the api image (same digest).
openctem_releases:
  v0.9.7:
    api: ghcr.io/openctemio/openctem-api@sha256:7986db7e74f0caf633f6df59b7089c5334e62cf5ba27bcbf0f463be23367cf00
    web: ghcr.io/openctemio/openctem-web@sha256:602ddd5b65a2709cc92b33a36abb8860cf41e656027b9f4fda4ceefc9b505408
    gateway: ghcr.io/openctemio/openctem-gateway@sha256:e448f6ce632814e1cf3ee2635cbab6c4cda27fae9274a3e78336543f8b412e0e
    migrations: ghcr.io/openctemio/migrations@sha256:3ae87e2a9341be1633b90096bb52a0eae9cef129559efad283e76b474b775f63
  v0.9.6:
    api: ghcr.io/openctemio/openctem-api@sha256:1489a027791157d6681682e01ade05d9f72b4aa727088ecfeb9f52bc71fe7b90
    web: ghcr.io/openctemio/openctem-web@sha256:cc405fe02b627f593290d6e095f9c85e752247280c1e56a1f8489a4d630da566
    gateway: ghcr.io/openctemio/openctem-gateway@sha256:4bae845ff489ab132a145d8b297dbc1f2b46419b9ffe93f73e8f27e44f6d6ae5
    migrations: ghcr.io/openctemio/migrations@sha256:88979a53c239d9a9148ac2ed8e0ed603dcc0c6b830991afa0acf00bfc6da7231

# cosign runs from its own image, pinned by digest.
openctem_cosign_image: ghcr.io/sigstore/cosign/cosign:v3.1.3@sha256:9e5c2f2edc34351160407ca3416c61855bdf9403c3c5936e0f0be7fc261611b8

