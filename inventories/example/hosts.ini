# Example inventory. Copy this directory OUTSIDE the repository, e.g.
#   mkdir -p ~/.config/openctem-ansible && cp -r inventories/example ~/.config/openctem-ansible/inventory
# then edit hosts.ini and group_vars/all.yml there and run with
#   ansible-playbook -i ~/.config/openctem-ansible/inventory/hosts.ini site.yml ...
# 203.0.113.10 is a documentation address (RFC 5737): nothing answers there.
[openctem]
vm1 ansible_host=203.0.113.10 ansible_user=ubuntu

# Ubuntu 26.04: python3 and classic sudo, if the defaults do not suit you:
#   ansible_python_interpreter=/usr/bin/python3.14 ansible_become_exe=/usr/bin/sudo.ws
