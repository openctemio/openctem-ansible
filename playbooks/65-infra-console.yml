---
# Optional web console for the HOST (disks, services, logs, journal): one private
# address, admin networks only, operators with password + one-time code, no terminal by default.
# Opt-in: -e apply_infra_console=true (or set it in your inventory). Without it this play
# does nothing. Rehearse with --check --diff first. infra_console_state=absent turns it off.
- name: Infrastructure console
  hosts: openctem
  become: true
  gather_facts: true
  tags: [infra_console]
  pre_tasks:
    - name: Skip unless apply_infra_console is true
      ansible.builtin.meta: end_play
      when: not (apply_infra_console | default(false) | bool)
    - name: Check the target OS
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version is version(openctem_min_ubuntu | default('24.04'), '>=')
        fail_msg: 'Unsupported OS {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.'
  roles:
    - role: infra_console
