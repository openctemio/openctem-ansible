---
# OpenCTEM (gateway, web, API, Postgres, Redis) + the Cloudflare Tunnel
# connector. Images by digest, cosign-verified; secrets generated on the host.
# Also upgrades (-e openctem_version=vX.Y.Z): backup first, and on failure a
# roll back to the previous compose file.
# Opt-in: -e apply_openctem=true (or set it in your inventory). Without it this play
# does nothing. Rehearse with --check --diff first.
- name: OpenCTEM platform
  hosts: openctem
  become: true
  gather_facts: true
  tags: [openctem]
  pre_tasks:
    - name: Skip unless apply_openctem is true
      ansible.builtin.meta: end_play
      when: not (apply_openctem | default(false) | bool)
    - name: Check the target OS
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version is version(openctem_min_ubuntu | default('24.04'), '>=')
        fail_msg: 'Unsupported OS {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.'
  roles:
    - role: cloudflared
      when: openctem_ingress | default('cloudflared') == 'cloudflared'
    - role: openctem
