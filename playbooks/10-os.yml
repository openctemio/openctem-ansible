---
# DevSec OS hardening, unattended security upgrades (no auto-reboot), chrony, auditd, persistent capped journald.
# Opt-in: -e apply_os=true (or set it in your inventory). Without it this play
# does nothing. Rehearse with --check --diff first.
- name: OS baseline
  hosts: openctem
  become: true
  gather_facts: true
  tags: [os]
  pre_tasks:
    - name: Skip unless apply_os is true
      ansible.builtin.meta: end_play
      when: not (apply_os | default(false) | bool)
    - name: Check the target OS
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version is version(openctem_min_ubuntu | default('24.04'), '>=')
        fail_msg: 'Unsupported OS {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.'
  roles:
    - role: os_baseline
