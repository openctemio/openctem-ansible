---
# Docker Engine + compose plugin from Docker's apt repository (pinned in versions.yml, held), daemon.json defaults. Nobody is added to the docker group.
# Opt-in: -e apply_docker=true (or set it in your inventory). Without it this play
# does nothing. Rehearse with --check --diff first.
- name: Docker Engine
  hosts: openctem
  become: true
  gather_facts: true
  tags: [docker]
  pre_tasks:
    - name: Skip unless apply_docker is true
      ansible.builtin.meta: end_play
      when: not (apply_docker | default(false) | bool)
    - name: Check the target OS
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version is version(openctem_min_ubuntu | default('24.04'), '>=')
        fail_msg: 'Unsupported OS {{ ansible_facts.distribution }} {{ ansible_facts.distribution_version }}.'
  roles:
    - role: docker
