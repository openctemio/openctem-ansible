---
# ufw: deny inbound except SSH from admin_cidrs; outbound open (tunnel, DNS, HTTPS). Refuses to run if this controller is outside admin_cidrs.
# With openctem_egress_policy: restricted it also blocks the stack's containers from private networks (docs/FIREWALL.md).
# Opt-in: -e apply_firewall=true (or set it in your inventory). Without it this play
# does nothing. Rehearse with --check --diff first.
- name: Host firewall (ufw)
  hosts: openctem
  become: true
  gather_facts: true
  tags: [firewall]
  pre_tasks:
    - name: Skip unless apply_firewall is true
      ansible.builtin.meta: end_play
      when: not (apply_firewall | default(false) | bool)
    - name: Check the target OS
      ansible.builtin.import_tasks: tasks/assert-os.yml
  roles:
    - role: firewall
