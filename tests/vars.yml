---
# Test values for tests/render.yml and tests/smoke.sh (documentation names only).
openctem_app_host: ctem.example.com
openctem_version: v0.10.1
openctem_ingress: cloudflared
admin_cidrs: [192.0.2.0/24]
backup_age_recipient: ''
# Mail relay (off unless a test sets openctem_mail_relay=true).
mail_relay_hostname: mail.example.com
mail_relay_sender_domains: [example.com]
openctem_mail_relay_from: noreply@example.com
# The checks read server files as root on a host; the tests read local paths.
openctem_checks_become: false
