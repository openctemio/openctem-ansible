---
# Runs only the feed proxy settings checks of roles/openctem (tests/feed-proxy.sh).
- name: Feed proxy settings checks
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../roles/openctem_common/defaults/main.yml
    - ../roles/openctem/defaults/main.yml
    - ../versions.yml
    - vars.yml
  tasks:
    - name: Checks
      ansible.builtin.import_tasks: ../roles/openctem/tasks/feed_proxy_checks.yml
